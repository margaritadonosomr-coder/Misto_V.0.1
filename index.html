document.addEventListener("change",e=>{if(["sI","sG","sA"].includes(e.target.id)){save();log("action","Escenario mayo: ingresos "+st.esc.i+" · gastos "+st.esc.g+" · ahorro "+(st.esc.i-st.esc.g))}});
